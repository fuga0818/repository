<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLAR SYSTEM EXPLORER</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --space-black: #000008;
    --accent-blue: #4fc3f7;
    --accent-glow: #00b4ff;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--space-black);
    color: #fff;
    font-family: 'Noto Sans JP', sans-serif;
    overflow-x: hidden;
  }

  /* ===== STARFIELD ===== */
  #starfield {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.2); transform: scale(1); }
    50%       { opacity: 1; transform: scale(1.5); }
  }
  .shooting-star {
    position: absolute;
    width: 130px; height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    border-radius: 50%;
    animation: shoot var(--sdur, 6s) linear infinite var(--sdelay, 0s);
    opacity: 0;
  }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0,0) rotate(-25deg); }
    5%   { opacity: 1; }
    25%  { opacity: 0; transform: translate(320px, 130px) rotate(-25deg); }
    100% { opacity: 0; transform: translate(320px, 130px) rotate(-25deg); }
  }

  /* ===== VIEW TRANSITIONS ===== */
  .view {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .view.hidden {
    opacity: 0; pointer-events: none; transform: scale(0.96);
  }

  /* ===== TOP VIEW ===== */
  #top-view { overflow: hidden; }

  .top-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.3rem, 4vw, 2.8rem);
    font-weight: 900;
    letter-spacing: 0.18em;
    text-align: center;
    color: var(--accent-blue);
    text-shadow: 0 0 18px var(--accent-glow), 0 0 40px #0055ff;
    margin-bottom: 0.3rem;
    animation: titlePulse 3.5s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 18px var(--accent-glow), 0 0 40px #0055ff; }
    50%       { text-shadow: 0 0 28px var(--accent-glow), 0 0 65px #0077ff, 0 0 90px #003388; }
  }
  .top-subtitle {
    font-size: clamp(0.65rem, 1.4vw, 0.9rem);
    letter-spacing: 0.28em;
    color: #7799bb;
    text-align: center;
    margin-bottom: 1.6rem;
  }
  .top-hint {
    margin-top: 1rem;
    font-size: 0.7rem;
    color: #334455;
    letter-spacing: 0.22em;
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 1; }
  }

  /* ===== ORRERY ===== */
  #orrery {
    position: relative;
    width: min(92vw, 580px);
    height: min(92vw, 580px);
    flex-shrink: 0;
  }
  .sun-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
  }
  .sun {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff9cc, #ffcc00 38%, #ff8800 65%, #ff4400);
    box-shadow: 0 0 18px #ffaa00, 0 0 45px #ff6600, 0 0 80px #ff330055;
    cursor: pointer;
    transition: transform 0.3s;
    animation: sunPulse 4s ease-in-out infinite;
  }
  .sun:hover { transform: scale(1.15); }
  @keyframes sunPulse {
    0%, 100% { box-shadow: 0 0 18px #ffaa00, 0 0 45px #ff6600, 0 0 80px #ff330055; }
    50%       { box-shadow: 0 0 28px #ffdd00, 0 0 65px #ff9900, 0 0 110px #ff440066; }
  }

  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(80,130,220,0.14);
    pointer-events: none;
  }
  .orbit-wrap {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    animation: orbitSpin linear infinite;
  }
  @keyframes orbitSpin {
    from { transform: translate(-50%,-50%) rotate(var(--start,0deg)); }
    to   { transform: translate(-50%,-50%) rotate(calc(var(--start,0deg) + 360deg)); }
  }
  .planet-dot {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.25s, filter 0.25s;
    top: 0; left: 50%;
    transform: translate(-50%, -50%);
  }
  .planet-dot:hover { transform: translate(-50%, -50%) scale(1.6); filter: brightness(1.4); }
  .planet-label {
    position: absolute;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.52rem;
    white-space: nowrap;
    color: rgba(180,210,255,0.85);
    pointer-events: none;
    animation: counterSpin linear infinite;
    transform-origin: center;
  }
  @keyframes counterSpin {
    from { transform: translate(-50%, 0) rotate(calc(-1 * var(--start,0deg))); }
    to   { transform: translate(-50%, 0) rotate(calc(-1 * var(--start,0deg) - 360deg)); }
  }

  /* ===== DETAIL VIEW ===== */
  #detail-view {
    background: radial-gradient(ellipse at 50% 40%, #080825 0%, #000008 65%);
    overflow-y: auto;
    justify-content: flex-start;
    padding: 1.8rem 1rem 3rem;
  }
  .detail-inner {
    width: 100%; max-width: 800px;
    margin: 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 1.6rem;
  }
  .detail-back-btn {
    align-self: flex-start;
    background: none; border: 1px solid #2a4a66;
    color: #7aaabb; padding: 0.42rem 1rem;
    font-family: 'Orbitron', sans-serif; font-size: 0.62rem;
    letter-spacing: 0.14em; cursor: pointer; border-radius: 4px;
    transition: all 0.28s;
  }
  .detail-back-btn:hover { background: #1a3344; color: #aaccdd; border-color: #5588aa; }

  /* planet sphere */
  .planet-stage {
    position: relative;
    width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
  }
  .planet-3d {
    border-radius: 50%;
    position: relative;
    animation: rotatePlanet 9s linear infinite;
    flex-shrink: 0;
    overflow: hidden;
  }
  @keyframes rotatePlanet {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .band {
    position: absolute; left: 0; right: 0;
    opacity: 0.35;
    pointer-events: none;
  }
  /* Saturn ring */
  .saturn-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border-style: solid;
    border-color: rgba(220,195,130,0.5);
    pointer-events: none;
    transform: translate(-50%,-50%) rotateX(74deg);
    box-shadow: 0 0 8px rgba(210,180,100,0.25);
  }

  .planet-names { text-align: center; }
  .planet-name-ja {
    font-size: clamp(1.9rem, 5vw, 2.9rem);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .planet-name-en {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.75rem, 1.8vw, 1rem);
    letter-spacing: 0.28em;
    color: #7799bb;
    margin-top: 0.35rem;
  }

  /* data grid */
  .data-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 0.9rem;
    width: 100%;
  }
  .data-card {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(90,140,220,0.18);
    border-radius: 10px;
    padding: 0.95rem 1.1rem;
    text-align: center;
    transition: background 0.28s, border-color 0.28s;
  }
  .data-card:hover { background: rgba(90,140,220,0.08); border-color: rgba(90,140,220,0.4); }
  .data-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: #5577aa;
    margin-bottom: 0.45rem;
  }
  .data-value {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(0.8rem, 1.8vw, 1rem);
    font-weight: 700;
  }

  .planet-desc {
    background: rgba(255,255,255,0.025);
    border-left: 3px solid currentColor;
    border-radius: 0 8px 8px 0;
    padding: 1.1rem 1.4rem;
    font-size: 0.9rem;
    line-height: 2;
    color: #ccddf0;
    width: 100%;
  }

  /* progress dots */
  .progress-dots {
    display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: center;
  }
  .p-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.18);
  }
  .p-dot.active { transform: scale(1.4); }

  /* nav buttons */
  .nav-btns {
    display: flex; gap: 0.9rem; flex-wrap: wrap; justify-content: center;
  }
  .nav-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    padding: 0.65rem 1.4rem;
    border: none; border-radius: 30px;
    cursor: pointer;
    transition: filter 0.25s, transform 0.2s;
  }
  .nav-btn:hover { filter: brightness(1.25); transform: translateY(-2px); }
  .nav-btn:active { transform: translateY(0); }
  .nav-btn-prev { background: linear-gradient(135deg, #1e3050, #2a4466); color: #88bbdd; }
  .nav-btn-next { background: linear-gradient(135deg, #1e3050, #2a4466); color: #88bbdd; }
  .nav-btn-home { background: linear-gradient(135deg, #172b1e, #224433); color: #77ddaa; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 580px) {
    #orrery { width: min(97vw, 340px); height: min(97vw, 340px); }
    .sun { width: 34px; height: 34px; }
    .planet-stage { width: 130px; height: 130px; }
    .top-title { letter-spacing: 0.1em; }
  }
</style>
</head>
<body>

<div id="starfield"></div>

<!-- TOP VIEW -->
<div class="view" id="top-view">
  <div class="top-title">SOLAR SYSTEM EXPLORER</div>
  <div class="top-subtitle">太陽系探索ガイド — 惑星をクリックして探索</div>
  <div id="orrery"></div>
  <div class="top-hint">▼ CLICK A PLANET TO EXPLORE ▼</div>
</div>

<!-- DETAIL VIEW -->
<div class="view hidden" id="detail-view">
  <div class="detail-inner">
    <button class="detail-back-btn" id="back-btn">← BACK TO SOLAR SYSTEM</button>
    <div class="planet-stage" id="planet-stage"></div>
    <div class="planet-names">
      <div class="planet-name-ja" id="detail-name-ja"></div>
      <div class="planet-name-en" id="detail-name-en"></div>
    </div>
    <div class="data-grid" id="detail-data"></div>
    <div class="planet-desc" id="detail-desc"></div>
    <div class="progress-dots" id="progress-dots"></div>
    <div class="nav-btns">
      <button class="nav-btn nav-btn-prev" id="btn-prev">◀ 前の天体</button>
      <button class="nav-btn nav-btn-home" id="btn-home">⌂ トップへ</button>
      <button class="nav-btn nav-btn-next" id="btn-next">次の天体 ▶</button>
    </div>
  </div>
</div>

// ============================================================
// STARFIELD
// ============================================================
(function buildStarfield() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 240; i++) {
    const el = document.createElement('div');
    el.className = 'star';
    const sz = Math.random() * 2.3 + 0.3;
    el.style.cssText = `
      width:${sz}px;height:${sz}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --dur:${1.8+Math.random()*5}s;
      --delay:${-Math.random()*9}s;
      --min-op:${0.08+Math.random()*0.45};
    `;
    sf.appendChild(el);
  }
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('div');
    el.className = 'shooting-star';
    el.style.cssText = `
      top:${Math.random()*65}%;left:${Math.random()*55}%;
      --sdur:${5+Math.random()*9}s;--sdelay:${-Math.random()*14}s;
    `;
    sf.appendChild(el);
  }
})();

// ============================================================
// ORRERY
// ============================================================
function buildOrrery() {
  const orrery = document.getElementById('orrery');
  orrery.innerHTML = '';
  const W = orrery.offsetWidth;
  const scale = W / 580;

  // sun
  const sunWrap = document.createElement('div');
  sunWrap.className = 'sun-wrap';
  const sunEl = document.createElement('div');
  sunEl.className = 'sun';
  sunEl.title = '太陽';
  sunEl.addEventListener('click', () => showDetail(0));
  sunWrap.appendChild(sunEl);
  orrery.appendChild(sunWrap);

  ORRERY_ORBITS.forEach(p => {
    const r = p.r * scale;
    const sz = Math.max(p.sz * scale, p.sz * 0.65);

    // orbit ring
    const ring = document.createElement('div');
    ring.className = 'orbit-ring';
    ring.style.width = ring.style.height = `${r*2}px`;
    orrery.appendChild(ring);

    // animated orbit wrapper
    const wrap = document.createElement('div');
    wrap.className = 'orbit-wrap';
    wrap.style.width = wrap.style.height = `${r*2}px`;
    wrap.style.animationDuration = `${p.period}s`;
    wrap.style.setProperty('--start', `${p.start}deg`);
    wrap.style.animationDelay = `-${(p.start/360)*p.period}s`;

    // planet dot
    const dot = document.createElement('div');
    dot.className = 'planet-dot';
    dot.style.cssText = `
      width:${sz}px;height:${sz}px;
      background:${p.color};
      box-shadow:0 0 ${sz*1.2}px ${p.color}99;
    `;
    dot.title = p.name;
    dot.addEventListener('click', () => showDetail(p.idx));

    // label (counter-rotates)
    const lbl = document.createElement('div');
    lbl.className = 'planet-label';
    lbl.textContent = p.name;
    lbl.style.cssText = `
      top:${-(sz/2+13)}px;left:50%;
      animation-duration:${p.period}s;
      animation-delay:-${(p.start/360)*p.period}s;
      --start:${p.start}deg;
    `;

    dot.appendChild(lbl);
    wrap.appendChild(dot);
    orrery.appendChild(wrap);
  });
}

// ============================================================
// DETAIL VIEW
// ============================================================
let currentIdx = 0;

function showDetail(idx) {
  currentIdx = idx;
  const b = BODIES[idx];

  // --- planet sphere ---
  const stage = document.getElementById('planet-stage');
  stage.innerHTML = '';
  const sz = Math.min(b.size, 140);

  const planet = document.createElement('div');
  planet.className = 'planet-3d';
  planet.style.cssText = `
    width:${sz}px;height:${sz}px;
    background:${b.gradient};
    box-shadow:0 0 ${sz*0.35}px ${b.glow}88,
               inset -${sz*0.22}px -${sz*0.1}px ${sz*0.2}px rgba(0,0,0,0.65);
  `;

  // Jupiter bands
  if (b.bands) {
    const bandCount = 8;
    for (let i = 0; i < bandCount; i++) {
      const band = document.createElement('div');
      band.className = 'band';
      const h = (sz / bandCount) * (0.6 + Math.random() * 0.8);
      const top = (sz / bandCount) * i + (Math.random() * 4 - 2);
      const color = b.bands[i % b.bands.length];
      band.style.cssText = `height:${h}px;top:${top}px;background:${color};`;
      planet.appendChild(band);
    }
  }

  stage.appendChild(planet);

  // Saturn ring
  if (b.ring) {
    const ring = document.createElement('div');
    ring.className = 'saturn-ring';
    const rW = sz * 1.9;
    const rH = sz * 0.27;
    ring.style.cssText = `
      width:${rW}px;height:${rH}px;
      border-width:${sz*0.1}px;
    `;
    stage.appendChild(ring);
  }

  // --- text ---
  const nameJa = document.getElementById('detail-name-ja');
  nameJa.textContent = b.ja;
  nameJa.style.color = b.color;
  document.getElementById('detail-name-en').textContent = b.en;

  // --- data cards ---
  const grid = document.getElementById('detail-data');
  grid.innerHTML = '';
  b.data.forEach(d => {
    const card = document.createElement('div');
    card.className = 'data-card';
    card.innerHTML = `
      <div class="data-label">${d.label}</div>
      <div class="data-value" style="color:${b.color}">${d.value}</div>
    `;
    grid.appendChild(card);
  });

  // --- description ---
  const descEl = document.getElementById('detail-desc');
  descEl.textContent = b.desc;
  descEl.style.color = '#ccddf0';
  descEl.style.borderLeftColor = b.color;

  // --- progress dots ---
  const dotsEl = document.getElementById('progress-dots');
  dotsEl.innerHTML = '';
  BODIES.forEach((bd, i) => {
    const dot = document.createElement('div');
    dot.className = 'p-dot' + (i === idx ? ' active' : '');
    dot.style.background = i === idx ? bd.color : 'rgba(255,255,255,0.18)';
    if (i === idx) dot.style.boxShadow = `0 0 8px ${bd.color}`;
    dot.title = bd.ja;
    dot.addEventListener('click', () => showDetail(i));
    dotsEl.appendChild(dot);
  });

  // --- transition ---
  document.getElementById('top-view').classList.add('hidden');
  const dv = document.getElementById('detail-view');
  dv.classList.remove('hidden');
  dv.scrollTop = 0;
}

function showTop() {
  document.getElementById('top-view').classList.remove('hidden');
  document.getElementById('detail-view').classList.add('hidden');
}

// ============================================================
// NAVIGATION
// ============================================================
document.getElementById('back-btn').addEventListener('click', showTop);
document.getElementById('btn-home').addEventListener('click', showTop);
document.getElementById('btn-prev').addEventListener('click', () =>
  showDetail((currentIdx - 1 + BODIES.length) % BODIES.length));
document.getElementById('btn-next').addEventListener('click', () =>
  showDetail((currentIdx + 1) % BODIES.length));

document.addEventListener('keydown', e => {
  if (document.getElementById('detail-view').classList.contains('hidden')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')
    showDetail((currentIdx + 1) % BODIES.length);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')
    showDetail((currentIdx - 1 + BODIES.length) % BODIES.length);
  else if (e.key === 'Escape') showTop();
});

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', buildOrrery);
let rsTimer;
window.addEventListener('resize', () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(buildOrrery, 280);
});
</script>
</body>
