<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLAR SYSTEM EXPLORER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --space-black: #000008;
  --accent-cyan: #00e5ff;
  --accent-blue: #4fc3f7;
  --text-primary: #e8f4fd;
  --text-secondary: #90caf9;
}

html, body {
  width: 100%; height: 100%;
  background: var(--space-black);
  color: var(--text-primary);
  font-family: 'Noto Sans JP', sans-serif;
  overflow-x: hidden;
}

/* STARS */
#stars-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

/* SCREENS */
.screen {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s ease;
  overflow-y: auto;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ========== TOP SCREEN ========== */
#screen-top {
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 18px 16px 40px;
}

.site-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.3rem, 3.8vw, 2.6rem);
  font-weight: 900;
  letter-spacing: 0.12em;
  text-align: center;
  margin-top: 20px;
  background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 50%, var(--accent-blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 18px rgba(79,195,247,0.5));
}

.site-subtitle {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.5rem, 1.4vw, 0.8rem);
  letter-spacing: 0.4em;
  color: var(--text-secondary);
  margin-top: 6px; text-align: center;
}

/* Orrery */
.orrery-wrapper {
  position: relative;
  width: min(90vw, 680px);
  aspect-ratio: 1;
  margin: 8px auto 0;
  flex-shrink: 0;
}

.orrery-svg {
  width: 100%; height: 100%;
  overflow: visible;
}

.orbit-ring {
  fill: none;
  stroke: rgba(79,195,247,0.13);
  stroke-width: 1;
}

.sun-wrapper {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
}

.sun-img {
  width: clamp(42px, 8.5vw, 68px);
  height: clamp(42px, 8.5vw, 68px);
  border-radius: 50%;
  object-fit: cover;
  box-shadow:
    0 0 18px 7px rgba(255,200,0,0.55),
    0 0 55px 18px rgba(255,140,0,0.28),
    0 0 110px 38px rgba(255,80,0,0.13);
  animation: sun-pulse 3s ease-in-out infinite;
}

@keyframes sun-pulse {
  0%,100% { box-shadow: 0 0 18px 7px rgba(255,200,0,0.55), 0 0 55px 18px rgba(255,140,0,0.28); }
  50%      { box-shadow: 0 0 28px 13px rgba(255,220,0,0.75), 0 0 75px 28px rgba(255,160,0,0.38); }
}

.planet-orbit {
  position: absolute; top: 50%; left: 50%;
  transform-origin: 0 0;
  pointer-events: none;
}

.planet-btn {
  position: absolute;
  border-radius: 50%; overflow: hidden;
  cursor: pointer;
  border: 2px solid rgba(255,255,255,0.18);
  transition: border-color 0.3s;
  pointer-events: all;
  background: #111;
}
.planet-btn:hover {
  border-color: var(--accent-cyan);
  z-index: 20;
}
.planet-btn img {
  width: 100%; height: 100%;
  object-fit: cover; border-radius: 50%; display: block;
}

.planet-label {
  position: absolute;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.4rem, 1vw, 0.6rem);
  color: var(--accent-cyan);
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 0 6px var(--accent-cyan);
  left: 50%; transform: translateX(-50%);
}

.hint-text {
  font-size: clamp(0.6rem, 1.4vw, 0.78rem);
  color: rgba(144,202,249,0.55);
  letter-spacing: 0.2em;
  margin-top: 10px; text-align: center;
  animation: blink 2.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:0.35} 50%{opacity:1} }

/* ========== DETAIL SCREEN ========== */
#screen-detail {
  background: linear-gradient(180deg, rgba(0,0,15,0.97) 0%, rgba(2,5,30,0.97) 100%);
  display: flex; flex-direction: column;
  align-items: center; padding: 0 0 60px;
}

.detail-header {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid rgba(79,195,247,0.18);
  background: rgba(0,0,20,0.85);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 50;
}

.back-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.58rem, 1.4vw, 0.72rem);
  color: var(--accent-cyan);
  background: none;
  border: 1px solid var(--accent-cyan);
  padding: 7px 14px; border-radius: 4px;
  cursor: pointer; letter-spacing: 0.15em;
  transition: background 0.3s, color 0.3s;
}
.back-btn:hover { background: var(--accent-cyan); color: #000; }

.detail-nav { display: flex; gap: 10px; }

.nav-btn {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.52rem, 1.2vw, 0.68rem);
  color: var(--text-secondary);
  background: rgba(79,195,247,0.07);
  border: 1px solid rgba(79,195,247,0.28);
  padding: 7px 12px; border-radius: 4px;
  cursor: pointer; letter-spacing: 0.08em;
  transition: all 0.3s; white-space: nowrap;
}
.nav-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

.detail-body {
  width: 100%; max-width: 880px;
  padding: 38px 22px 0;
  display: flex; flex-direction: column;
  align-items: center; gap: 36px;
}

/* Planet display */
.planet-display {
  position: relative;
  display: flex; align-items: center; justify-content: center;
}

.planet-glow-ring {
  position: absolute; border-radius: 50%;
  animation: glow-pulse 3s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
  50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.06); }
}

.planet-detail-img {
  width: clamp(170px, 38vw, 290px);
  height: clamp(170px, 38vw, 290px);
  border-radius: 50%; object-fit: cover;
  animation: planet-spin 28s linear infinite;
  position: relative; z-index: 2;
  border: 2px solid rgba(255,255,255,0.13);
}
@keyframes planet-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* Info */
.planet-info { width: 100%; text-align: center; }

.planet-name-ja {
  font-size: clamp(1.9rem, 6.5vw, 3.3rem);
  font-weight: 700; line-height: 1; margin-bottom: 6px;
}
.planet-name-en {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.85rem, 2.3vw, 1.3rem);
  letter-spacing: 0.3em; color: var(--text-secondary);
  font-weight: 400; margin-bottom: 28px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px; max-width: 580px;
  margin: 0 auto 28px;
}
@media (min-width: 580px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}

.stat-card {
  background: rgba(79,195,247,0.055);
  border: 1px solid rgba(79,195,247,0.18);
  border-radius: 8px; padding: 14px 10px; text-align: center;
  transition: border-color 0.3s;
}
.stat-card:hover { border-color: rgba(79,195,247,0.45); }

.stat-label {
  font-size: 0.62rem; letter-spacing: 0.18em;
  color: var(--text-secondary); margin-bottom: 8px;
  font-family: 'Orbitron', sans-serif;
}
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.75rem, 1.8vw, 0.95rem);
  font-weight: 700; color: var(--text-primary);
}

.divider {
  width: 100%; max-width: 580px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(79,195,247,0.35), transparent);
  margin: 0 auto;
}

.planet-desc {
  max-width: 620px; margin: 0 auto;
  line-height: 1.95; font-size: clamp(0.82rem, 1.9vw, 0.97rem);
  color: rgba(232,244,253,0.83);
  background: rgba(79,195,247,0.04);
  border-left: 3px solid var(--accent-cyan);
  padding: 18px 22px; border-radius: 0 8px 8px 0;
  text-align: left;
}

@media (max-width: 460px) {
  .detail-header { padding: 10px 12px; }
  .back-btn { padding: 6px 9px; }
  .nav-btn  { padding: 6px 7px; }
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<!-- TOP SCREEN -->
<div id="screen-top" class="screen active">
  <h1 class="site-title">SOLAR SYSTEM EXPLORER</h1>
  <p class="site-subtitle">太陽系 宇宙探索</p>

  <div class="orrery-wrapper" id="orrery">
    <svg class="orrery-svg" id="orbit-svg" viewBox="0 0 680 680"></svg>
    <div class="sun-wrapper">
      <img class="sun-img" id="sun-btn"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/1024px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg"
        alt="太陽">
    </div>
    <!-- Planets injected by JS -->
  </div>

  <p class="hint-text">▶ 惑星をクリックして探索する</p>
</div>

<!-- DETAIL SCREEN -->
<div id="screen-detail" class="screen">
  <div class="detail-header">
    <button class="back-btn" id="back-btn">◀ TOP</button>
    <div class="detail-nav">
      <button class="nav-btn" id="prev-btn">◀ 前の惑星</button>
      <button class="nav-btn" id="next-btn">次の惑星 ▶</button>
    </div>
  </div>

  <div class="detail-body">
    <div class="planet-display" id="planet-display">
      <div class="planet-glow-ring" id="planet-glow"></div>
      <img class="planet-detail-img" id="planet-img" src="" alt="">
    </div>

    <div class="planet-info">
      <div class="planet-name-ja" id="planet-name-ja"></div>
      <div class="planet-name-en" id="planet-name-en"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">直径</div>
          <div class="stat-value" id="stat-diameter"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">太陽からの距離</div>
          <div class="stat-value" id="stat-distance"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">公転周期</div>
          <div class="stat-value" id="stat-period"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">衛星数</div>
          <div class="stat-value" id="stat-moons"></div>
        </div>
      </div>

      <div class="divider"></div>
      <br>
      <p class="planet-desc" id="planet-desc"></p>
    </div>
  </div>
</div>

<script>
// ===== PLANET DATA =====
const planets = [
  {
    nameJa: '水星', nameEn: 'MERCURY',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mercury_in_true_color.jpg/600px-Mercury_in_true_color.jpg',
    color: '#b5a99a',
    glowColor: 'rgba(181,169,154,0.45)',
    diameter: '4,879 km',
    distance: '0.39 AU',

    orbitR: 0.175, size: 0.030, speed: 0.047, startAngle: 0.8
  },
  {
    nameJa: '金星', nameEn: 'VENUS',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Venus-real_color.jpg/600px-Venus-real_color.jpg',

    glowColor: 'rgba(232,205,160,0.45)',
    diameter: '12,104 km',
    distance: '0.72 AU',
    period: '225 日',
    moons: '0',
    desc: '地球の双子星とも呼ばれるが、分厚い二酸化炭素の大気が強烈な温室効果を生み、表面温度は約465℃に達する。太陽系で最も高温な惑星で、自転方向が他の惑星と逆向きという特異な性質を持つ。',
    orbitR: 0.240, size: 0.040, speed: 0.035, startAngle: 2.1
  },
  {
    nameJa: '地球', nameEn: 'EARTH',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/600px-The_Earth_seen_from_Apollo_17.jpg',
    color: '#4fc3f7',
    glowColor: 'rgba(79,195,247,0.45)',
    diameter: '12,742 km',
    distance: '1.00 AU',
    period: '365 日',
    moons: '1（月）',
    desc: '太陽系唯一の生命体が確認されている惑星。液体の水が存在し、適切な大気組成と磁場を持つ。表面積の約71%が海洋で覆われており、プレートテクトニクスによって地表が継続的に変化している。',
    orbitR: 0.312, size: 0.042, speed: 0.028, startAngle: 4.5
  },
  {
    nameJa: '火星', nameEn: 'MARS',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/600px-OSIRIS_Mars_true_color.jpg',
    color: '#c1440e',
    glowColor: 'rgba(193,68,14,0.45)',
    diameter: '6,779 km',
    distance: '1.52 AU',
    period: '687 日',
    moons: '2',
    desc: '赤い惑星と呼ばれる火星は、酸化鉄に覆われた赤茶けた地表が特徴。太陽系最高峰のオリンポス山（標高21km）を持ち、古代には液体の水が流れた痕跡が数多く残る。現在も多数の探査機が調査中。',
    orbitR: 0.388, size: 0.034, speed: 0.022, startAngle: 1.3
  },
  {
    nameJa: '木星', nameEn: 'JUPITER',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg/600px-Jupiter_and_its_shrunken_Great_Red_Spot.jpg',
    color: '#c88b3a',
    glowColor: 'rgba(200,139,58,0.45)',
    diameter: '139,820 km',
    distance: '5.20 AU',
    period: '11.9 年',
    moons: '95',
    desc: '太陽系最大の惑星で、質量は他の全惑星の合計の2.5倍以上。大赤斑は地球が2〜3個入る巨大な嵐で300年以上継続している。強力な磁場と多数の衛星を持ち、ガリレオが発見した4大衛星は今も研究対象。',
    orbitR: 0.468, size: 0.068, speed: 0.013, startAngle: 3.7
  },
  {
    nameJa: '土星', nameEn: 'SATURN',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/600px-Saturn_during_Equinox.jpg',
    color: '#e4d191',
    glowColor: 'rgba(228,209,145,0.45)',
    diameter: '116,460 km',
    distance: '9.58 AU',
    period: '29.5 年',
    moons: '146',
    desc: '美しい環を持つ惑星として知られる土星。環は氷と岩石からなり、幅は数十万kmに及ぶが厚さはわずか数百m。平均密度は水より低く、太陽系の惑星の中で唯一水に浮くことができるとされる。',
    orbitR: 0.550, size: 0.060, speed: 0.009, startAngle: 0.5
  },
  {
    nameJa: '天王星', nameEn: 'URANUS',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Uranus2.jpg/600px-Uranus2.jpg',
    color: '#7de8e8',
    glowColor: 'rgba(125,232,232,0.45)',
    diameter: '50,724 km',
    distance: '19.2 AU',
    period: '84 年',
    moons: '28',
    desc: '自転軸が97.77°傾いており、横倒しで公転する特異な惑星。青緑色の外観はメタンガスによるもので、核は氷と岩石で構成される「氷巨人」に分類される。内部構造の詳細はいまだ未解明の部分が多い。',
    orbitR: 0.630, size: 0.050, speed: 0.006, startAngle: 2.8
  },
  {
    nameJa: '海王星', nameEn: 'NEPTUNE',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg/600px-Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg',
    color: '#3f6bbf',
    glowColor: 'rgba(63,107,191,0.45)',
    diameter: '49,244 km',
    distance: '30.1 AU',
    period: '165 年',
    moons: '16',
    desc: '太陽系最外縁の惑星で、太陽から約45億km離れている。風速2,100km/hという太陽系最速の風が吹き荒れる。唯一ボイジャー2号のみが接近探査を行い、大暗斑と呼ばれる巨大嵐を観測した。',
    orbitR: 0.708, size: 0.048, speed: 0.004, startAngle: 5.1
  }
];

// ===== STARS =====
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 2800);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.2,
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of stars) {
    const a = 0.25 + 0.75 * Math.abs(Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }
}

resizeCanvas(); initStars();
window.addEventListener('resize', () => { resizeCanvas(); initStars(); buildOrrery(); });

// ===== ORRERY =====
const orrery   = document.getElementById('orrery');
const orbitSvg = document.getElementById('orbit-svg');
let planetOrbitEls = [];

function buildOrrery() {
  document.querySelectorAll('.planet-orbit').forEach(e => e.remove());
  planetOrbitEls = [];
  orbitSvg.innerHTML = '';

  const w  = orrery.offsetWidth;
  const cx = w / 2, cy = w / 2;

  // Orbit rings
  planets.forEach(p => {
    const r = p.orbitR * w;
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', r);
    circle.setAttribute('class', 'orbit-ring');
    orbitSvg.appendChild(circle);
  });

  // Planet elements
  planets.forEach((p, i) => {
    const orbitR = p.orbitR * w;
    const pSize  = Math.max(p.size * w, 16);

    const orbitDiv = document.createElement('div');
    orbitDiv.className = 'planet-orbit';

    const btn = document.createElement('div');
    btn.className = 'planet-btn';
    btn.style.cssText = `width:${pSize}px;height:${pSize}px;left:${orbitR - pSize/2}px;top:${-pSize/2}px;`;
    btn.title = p.nameJa;

    const img = document.createElement('img');
    img.src = p.img; img.alt = p.nameJa;
    btn.appendChild(img);

    const label = document.createElement('div');
    label.className = 'planet-label';
    label.textContent = p.nameJa;
    label.style.top = (pSize + 4) + 'px';
    btn.appendChild(label);

    btn.addEventListener('click', () => showPlanet(i));
    orbitDiv.appendChild(btn);
    orrery.appendChild(orbitDiv);
    planetOrbitEls.push({ orbitDiv });
  });
}

buildOrrery();

// ===== ANIMATION LOOP =====
let lastTime = 0, elapsed = 0;

function animate(ts) {
  const dt = ts - lastTime;
  lastTime = ts;
  elapsed += dt * 0.001;

  drawStars(elapsed);

  planets.forEach((p, i) => {
    const el = planetOrbitEls[i];
    if (!el) return;
    const angle = p.startAngle + elapsed * p.speed * 2 * Math.PI;
    el.orbitDiv.style.transform = `rotate(${angle}rad)`;
    const label = el.orbitDiv.querySelector('.planet-label');
    if (label) label.style.transform = `translateX(-50%) rotate(${-angle}rad)`;
    const btn = el.orbitDiv.querySelector('.planet-btn');
    if (btn) btn.style.transform = `rotate(${-angle}rad)`;
  });

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ===== SCREEN TRANSITIONS =====
const screenTop    = document.getElementById('screen-top');
const screenDetail = document.getElementById('screen-detail');
let currentIdx = 0;

function showScreen(toShow, toHide) {
  toHide.style.opacity = '0';
  toHide.style.pointerEvents = 'none';
  toHide.classList.remove('active');
  setTimeout(() => {
    toShow.classList.add('active');
    toShow.style.opacity = '1';
    toShow.style.pointerEvents = 'all';
    toShow.scrollTop = 0;
  }, 320);
}

function showPlanet(idx) {
  currentIdx = ((idx % planets.length) + planets.length) % planets.length;
  const p = planets[currentIdx];

  document.getElementById('planet-img').src = p.img;
  document.getElementById('planet-img').alt = p.nameJa;
  document.getElementById('planet-name-ja').textContent = p.nameJa;
  document.getElementById('planet-name-ja').style.color = p.color;
  document.getElementById('planet-name-en').textContent = p.nameEn;
  document.getElementById('stat-diameter').textContent  = p.diameter;
  document.getElementById('stat-distance').textContent  = p.distance;
  document.getElementById('stat-period').textContent    = p.period;
  document.getElementById('stat-moons').textContent     = p.moons;
  document.getElementById('planet-desc').textContent    = p.desc;

  const glow = document.getElementById('planet-glow');
  const sz = Math.min(window.innerWidth * 0.6, 300);
  glow.style.cssText = `
    width:${sz}px; height:${sz}px;
    left:50%; top:50%;
    background: radial-gradient(circle, ${p.glowColor} 0%, transparent 70%);
    transform: translate(-50%,-50%) scale(1);
  `;

  showScreen(screenDetail, screenTop);
}

document.getElementById('back-btn').addEventListener('click', () => showScreen(screenTop, screenDetail));
document.getElementById('prev-btn').addEventListener('click', () => showPlanet(currentIdx - 1));
document.getElementById('next-btn').addEventListener('click', () => showPlanet(currentIdx + 1));
</script>
