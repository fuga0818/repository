<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアル人生シミュレーター</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; font-family:'Segoe UI','Hiragino Sans',sans-serif; color:#e6edf3; overflow:hidden; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#root { width:1000px; height:660px; position:relative; border-radius:12px; overflow:hidden; box-shadow:0 0 60px rgba(56,139,253,0.2); }
canvas { position:absolute; top:0; left:0; }
#ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }

/* ---------- Left panel ---------- */
#panel-left { position:absolute; top:8px; left:8px; width:220px; height:390px; background:rgba(13,17,23,0.88); border:1px solid #30363d; border-radius:10px; padding:12px; pointer-events:auto; }
.panel-title { font-size:11px; color:#58a6ff; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; border-bottom:1px solid #21262d; padding-bottom:4px; }
.stat-row { display:flex; align-items:center; margin-bottom:7px; gap:6px; }
.stat-label { font-size:11px; color:#8b949e; width:68px; flex-shrink:0; }
.stat-bar-bg { flex:1; height:8px; background:#21262d; border-radius:4px; overflow:hidden; }
.stat-bar { height:100%; border-radius:4px; transition:width 0.4s; }
.stat-val { font-size:11px; color:#c9d1d9; width:26px; text-align:right; flex-shrink:0; }
#char-info { margin-top:10px; font-size:12px; color:#c9d1d9; line-height:1.8; }
#char-info span { color:#f0f6fc; font-weight:600; }

/* ---------- Right panel ---------- */
#panel-right { position:absolute; top:8px; right:8px; width:220px; height:390px; background:rgba(13,17,23,0.88); border:1px solid #30363d; border-radius:10px; padding:12px; pointer-events:auto; }
.money-row { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
.money-label { color:#8b949e; }
.money-val { font-family:monospace; }
.money-pos { color:#3fb950; }
.money-neg { color:#f85149; }
.money-neutral { color:#c9d1d9; }
.divider { border:none; border-top:1px solid #21262d; margin:7px 0; }
#savings-big { font-size:22px; font-family:monospace; color:#58a6ff; font-weight:700; text-align:center; margin:8px 0 4px; }
#savings-label { font-size:10px; color:#8b949e; text-align:center; margin-bottom:8px; }
#net-row { display:flex; justify-content:space-between; font-size:13px; font-weight:600; padding:5px 0; border-top:1px solid #30363d; }

/* ---------- Event log ---------- */
#panel-log { position:absolute; bottom:8px; left:8px; right:8px; height:220px; background:rgba(13,17,23,0.90); border:1px solid #30363d; border-radius:10px; padding:10px 12px; pointer-events:auto; display:flex; flex-direction:column; gap:6px; }
#log-header { display:flex; align-items:center; justify-content:space-between; }
#log-title { font-size:11px; color:#58a6ff; text-transform:uppercase; letter-spacing:1px; }
#date-display { font-size:13px; font-family:monospace; color:#c9d1d9; }
#log-body { flex:1; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:3px; }
#log-body::-webkit-scrollbar { width:4px; } #log-body::-webkit-scrollbar-thumb { background:#30363d; border-radius:2px; }
.log-entry { font-size:12px; line-height:1.5; padding:3px 6px; border-radius:4px; }
.log-normal { color:#c9d1d9; }
.log-event  { color:#f0f6fc; background:#161b22; }
.log-good   { color:#3fb950; background:#0f2a18; }
.log-bad    { color:#f85149; background:#2d0f0f; }
.log-warn   { color:#d29922; background:#2a1f0f; }
.log-month  { color:#58a6ff; background:#0d1f3c; font-weight:600; border-left:2px solid #1f6feb; padding-left:8px; }

/* ---------- Action area ---------- */
#action-area { position:absolute; bottom:230px; right:8px; width:220px; display:flex; flex-direction:column; gap:5px; pointer-events:auto; }
.act-btn { background:#161b22; border:1px solid #30363d; border-radius:7px; padding:7px 10px; font-size:12px; color:#c9d1d9; cursor:pointer; text-align:left; transition:all 0.15s; display:flex; align-items:center; gap:6px; }
.act-btn:hover { background:#1f2937; border-color:#58a6ff; color:#f0f6fc; }
.act-btn:disabled { opacity:0.35; cursor:not-allowed; }
.act-btn .act-cost { margin-left:auto; font-size:10px; color:#8b949e; }

/* ---------- Time control ---------- */
#time-ctrl { position:absolute; bottom:230px; left:8px; width:220px; display:flex; gap:5px; pointer-events:auto; }
.ctrl-btn { flex:1; background:#161b22; border:1px solid #30363d; border-radius:7px; padding:8px; font-size:12px; color:#c9d1d9; cursor:pointer; text-align:center; transition:all 0.15s; }
.ctrl-btn:hover { background:#1f2937; border-color:#58a6ff; }
.ctrl-btn.active { background:#0d2137; border-color:#1f6feb; color:#58a6ff; }
#speed-label { font-size:10px; color:#8b949e; text-align:center; margin-top:3px; }

/* ---------- Modal ---------- */
#modal-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:center; justify-content:center; pointer-events:auto; z-index:100; }
#modal-overlay.active { display:flex; }
#modal-box { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:28px 32px; width:460px; max-height:560px; overflow-y:auto; }
#modal-icon { font-size:40px; text-align:center; margin-bottom:8px; }
#modal-title { font-size:20px; font-weight:700; color:#f0f6fc; text-align:center; margin-bottom:8px; }
#modal-body { font-size:14px; color:#8b949e; line-height:1.8; text-align:center; margin-bottom:18px; }
#modal-choices { display:flex; flex-direction:column; gap:8px; }
.choice-btn { background:#21262d; border:1px solid #30363d; border-radius:8px; padding:12px 16px; font-size:13px; color:#c9d1d9; cursor:pointer; text-align:left; transition:all 0.15s; }
.choice-btn:hover { background:#1f2937; border-color:#58a6ff; color:#f0f6fc; }
.choice-desc { font-size:11px; color:#8b949e; margin-top:3px; }

/* ---------- Game Over ---------- */
#gameover { position:absolute; inset:0; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; pointer-events:auto; z-index:200; }
#gameover.active { display:flex; }
#gameover h1 { font-size:32px; color:#f0f6fc; }
#gameover .summary { font-size:14px; color:#8b949e; text-align:center; line-height:2; max-width:500px; }
#restart-btn { background:#1f6feb; border:none; border-radius:8px; padding:12px 32px; font-size:16px; color:#fff; cursor:pointer; }
#restart-btn:hover { background:#388bfd; }

/* ---------- Start Screen ---------- */
#start-screen { position:absolute; inset:0; background:rgba(13,17,23,0.96); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; pointer-events:auto; z-index:200; }
#start-screen h1 { font-size:28px; color:#f0f6fc; letter-spacing:2px; }
#start-screen p { font-size:13px; color:#8b949e; text-align:center; max-width:420px; line-height:1.8; }
.start-choices { display:flex; gap:12px; margin-top:8px; }
.start-card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:18px 22px; width:140px; cursor:pointer; text-align:center; transition:all 0.2s; }
.start-card:hover { border-color:#58a6ff; background:#0d1f3c; }
.start-card .icon { font-size:32px; margin-bottom:8px; }
.start-card .label { font-size:13px; color:#c9d1d9; font-weight:600; }
.start-card .desc { font-size:11px; color:#8b949e; margin-top:4px; line-height:1.5; }
#name-input { background:#21262d; border:1px solid #30363d; border-radius:6px; padding:8px 14px; font-size:14px; color:#f0f6fc; width:200px; text-align:center; outline:none; }
#name-input:focus { border-color:#58a6ff; }
</style>
</head>
<body>
<div id="root">
  <canvas id="bg-canvas" width="1000" height="660"></canvas>
  <div id="ui">
    <!-- Left: Character Stats -->
    <div id="panel-left">
      <div class="panel-title">ステータス</div>
      <div class="stat-row"><span class="stat-label">❤️ 健康</span><div class="stat-bar-bg"><div class="stat-bar" id="bar-hp" style="background:#f85149"></div></div><span class="stat-val" id="val-hp">95</span></div>
      <div class="stat-row"><span class="stat-label">😤 ストレス</span><div class="stat-bar-bg"><div class="stat-bar" id="bar-st" style="background:#d29922"></div></div><span class="stat-val" id="val-st">10</span></div>
      <div class="stat-row"><span class="stat-label">😊 幸福度</span><div class="stat-bar-bg"><div class="stat-bar" id="bar-hap" style="background:#ff80ab"></div></div><span class="stat-val" id="val-hap">70</span></div>
      <div class="stat-row"><span class="stat-label">🤝 社会性</span><div class="stat-bar-bg"><div class="stat-bar" id="bar-soc" style="background:#79c0ff"></div></div><span class="stat-val" id="val-soc">50</span></div>
      <div id="char-info"></div>
    </div>

    <!-- Right: Finance -->
    <div id="panel-right">
      <div class="panel-title">家計</div>
      <div id="savings-big">¥0</div>
      <div id="savings-label">貯蓄</div>
      <hr class="divider">
      <div class="money-row"><span class="money-label">💼 月収（手取り）</span><span class="money-val money-pos" id="fin-income">¥0</span></div>
      <div class="money-row"><span class="money-label">🏠 家賃</span><span class="money-val money-neg" id="fin-rent">¥0</span></div>
      <div class="money-row"><span class="money-label">🍚 食費</span><span class="money-val money-neg" id="fin-food">¥0</span></div>
      <div class="money-row"><span class="money-label">💡 光熱費</span><span class="money-val money-neg" id="fin-util">¥0</span></div>
      <div class="money-row"><span class="money-label">🏥 保険・年金</span><span class="money-val money-neg" id="fin-ins">¥0</span></div>
      <div class="money-row"><span class="money-label">👶 教育費</span><span class="money-val money-neg" id="fin-edu">¥0</span></div>
      <div class="money-row"><span class="money-label">💳 その他</span><span class="money-val money-neg" id="fin-misc">¥0</span></div>
      <div id="net-row"><span>月間収支</span><span id="fin-net" class="money-pos">¥0</span></div>
    </div>

    <!-- Time control (left of log) -->
    <div id="time-ctrl">
      <button class="ctrl-btn" id="btn-pause" onclick="togglePause()">⏸ 一時停止</button>
      <button class="ctrl-btn" id="btn-speed" onclick="cycleSpeed()">⏩ 速度</button>
    </div>
    <div style="position:absolute;bottom:428px;left:8px;width:220px;"><div id="speed-label">速度: 普通 (1秒/月)</div></div>

    <!-- Action buttons (right of log) -->
    <div id="action-area"></div>

    <!-- Event Log -->
    <div id="panel-log">
      <div id="log-header">
        <span id="log-title">ライフログ</span>
        <span id="date-display">──</span>
      </div>
      <div id="log-body"></div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay">
      <div id="modal-box">
        <div id="modal-icon"></div>
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <div id="modal-choices"></div>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameover">
      <h1>人生終了</h1>
      <div class="summary" id="go-summary"></div>
      <button id="restart-btn" onclick="location.reload()">もう一度生きる</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" id="start-screen">
      <h1>🌱 リアル人生シミュレーター</h1>
      <p>0歳の誕生から始まるリアルな人生。幼少期・学校・就職・恋愛・結婚・老後・死まで、<br>すべての選択があなたの人生を決めます。</p>
      <label style="font-size:13px;color:#8b949e;">名前</label>
      <input id="name-input" type="text" placeholder="名前を入力" maxlength="10" value="田中 太郎">
      <div style="margin-top:8px;">
        <div class="start-card" style="width:200px;margin:0 auto;" onclick="startGame()">
          <div class="icon">👶</div>
          <div class="label">この世に生まれる</div>
          <div class="desc">0歳から人生を始める</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
// ============================================================
// GAME STATE
// ============================================================
const S = {
  name: '田中 太郎',
  age: 0, year: 1988, month: 1,
  hp: 100, stress: 0, happiness: 80, social: 20,
  savings: 0,
  education: 'none', // none / highschool / university
  job: null, jobMonths: 0, jobTitle: '無職',
  grossIncome: 0,
  netIncome: 0,
  // childhood stats (影響は就職・健康へ)
  studyLevel: 0,    // 0-100
  athleticLevel: 0, // 0-100
  // family
  livingWith: 'parents',
  partner: null,
  married: false,
  children: [],
  parentHealth: 100,
  parentNeedsCare: false,
  // flags
  hasLoan: false, loanBalance: 0, loanMonthly: 0,
  hasInvestment: false, investBalance: 0,
  isDead: false, deathAge: null, deathCause: null,
  lifeEvents: [],
  // internal
  inChildhood: true,  // age < 18
  inUniversity: false, uniYear: 0,
  unemployedMonths: 0,
  exerciseStreak: 0,
  lastEventMonth: -12,
  // childhood school stage flags
  hsPathChosen: false,
};

// Job table: key → { title, gross, req }
const JOBS = {
  parttime:     { title: 'アルバイト',         gross: 110000,  req: null },
  office_hs:    { title: '会社員（高卒）',      gross: 200000,  req: 'highschool' },
  office_uni:   { title: '会社員（大卒）',      gross: 240000,  req: 'university' },
  engineer:     { title: 'エンジニア',          gross: 350000,  req: 'university' },
  sales:        { title: '営業職',              gross: 280000,  req: 'highschool' },
  nurse:        { title: '看護師',              gross: 310000,  req: 'university' },
  teacher:      { title: '教員',                gross: 290000,  req: 'university' },
  manager:      { title: '管理職（課長）',       gross: 500000,  req: null, promote: true },
  senior_mgr:   { title: '部長',               gross: 650000,  req: null, promote: true },
  executive:    { title: '役員・取締役',         gross: 900000,  req: null, promote: true },
  freelance:    { title: 'フリーランス',         gross: 400000,  req: 'university' },
  unemployed:   { title: '求職中',              gross: 0,       req: null },
};

// Monthly expenses calculator
function calcExpenses() {
  let rent = 0, food = 0, util = 0, ins = 0, edu = 0, misc = 0;
  if (S.livingWith === 'parents') {
    food = 20000; util = 5000; misc = 15000;
  } else {
    // 1R~2LDK depending on family
    const baseRent = S.children.length > 0 ? 90000 : (S.married ? 80000 : 68000);
    rent = baseRent;
    food = S.married ? 50000 : 30000;
    food += S.children.filter(c=>c.age<18).length * 15000;
    util = S.married ? 18000 : 10000;
    misc = 20000 + S.children.filter(c=>c.age<18).length * 5000;
  }
  // 保険・年金
  if (S.grossIncome > 0) {
    ins = Math.round(S.grossIncome * 0.14); // 厚生年金+健康保険の概算
  } else {
    ins = 16000; // 国民年金
  }
  // 子供の教育費
  S.children.forEach(c => {
    if (c.age >= 3 && c.age < 6) edu += 25000;   // 保育園
    else if (c.age >= 6 && c.age < 15) edu += 15000; // 小中学校+習い事
    else if (c.age >= 15 && c.age < 18) edu += 30000; // 高校
    else if (c.age >= 18 && c.age < 22) edu += 60000; // 大学
  });
  // ローン返済
  misc += S.loanMonthly;
  return { rent, food, util, ins, edu, misc };
}

function calcTax(gross) {
  // 簡易所得税+住民税（年収換算で概算）
  const annual = gross * 12;
  let rate = 0.05;
  if (annual > 1950000) rate = 0.10;
  if (annual > 3300000) rate = 0.15;
  if (annual > 6950000) rate = 0.23;
  if (annual > 9000000) rate = 0.33;
  return Math.round(gross * rate);
}

// ============================================================
// RENDERING (Phaser background)
// ============================================================
let phaserScene;
class BgScene extends Phaser.Scene {
  constructor() { super('BgScene'); }
  create() {
    phaserScene = this;
    this.skyGfx = this.add.graphics();
    this.worldGfx = this.add.graphics();
    this.charGfx = this.add.graphics();
    this.celestialGfx = this.add.graphics();
    this._buildStaticWorld();
    this.charX = 500; this.charTargetX = 500;
  }
  _buildStaticWorld() {
    const g = this.worldGfx;
    // Ground
    g.fillStyle(0x2d5a1b, 1); g.fillRect(0, 340, 1000, 60);
    g.fillStyle(0x3d7a25, 1); g.fillRect(0, 330, 1000, 14);
    // Road
    g.fillStyle(0x555, 1); g.fillRect(0, 360, 1000, 40);
    g.fillStyle(0xffffff, 1);
    for (let x=0; x<1000; x+=80) g.fillRect(x, 376, 40, 5);
    // House 1
    this._house(g, 50, 190, 180, 140);
    // Apartment
    this._apartment(g, 700, 100, 220, 230);
    // Trees
    [280,380,480,580].forEach(x=>this._tree(g, x, 290+Math.sin(x)*5));
  }
  _house(g, x, y, w, h) {
    g.fillStyle(0xd4956a, 1); g.fillRect(x, y, w, h);
    g.fillStyle(0xb07850, 1); g.fillRect(x+w-40, y, 40, h);
    g.fillStyle(0x7a4f35, 1); g.fillTriangle(x-10, y, x+w/2, y-70, x+w+10, y);
    g.fillStyle(0x6d4c41, 1); g.fillRect(x+w/2-22, y+h-55, 44, 55);
    g.fillStyle(0xfff9c4, 1);
    [[25,30],[w-65,30],[25,90],[w-65,90]].forEach(([dx,dy])=>g.fillRect(x+dx, y+dy, 36, 28));
  }
  _apartment(g, x, y, w, h) {
    g.fillStyle(0x607d8b, 1); g.fillRect(x, y, w, h);
    g.fillStyle(0x455a64, 1); g.fillRect(x+w-30, y, 30, h);
    g.fillStyle(0x90a4ae, 1); g.fillRect(x, y, w, 12);
    // Windows grid
    g.fillStyle(0xfff9c4, 1);
    for (let row=0; row<5; row++) for (let col=0; col<4; col++)
      g.fillRect(x+15+col*50, y+25+row*40, 28, 22);
    g.fillStyle(0x37474f, 1); g.fillRect(x+w/2-18, y+h-50, 36, 50);
  }
  _tree(g, x, y) {
    g.fillStyle(0x5d4037, 1); g.fillRect(x-6, y, 12, 50);
    g.fillStyle(0x2e7d32, 1); g.fillCircle(x, y-5, 30);
    g.fillStyle(0x388e3c, 1); g.fillCircle(x-12, y+8, 20); g.fillCircle(x+12, y+8, 20);
  }
  drawSky(hour) {
    const g = this.skyGfx; g.clear();
    let top, bot;
    if (hour >= 5 && hour < 8) {
      const t=(hour-5)/3;
      top = lerpColor(0x0d0d2b, 0x1565c0, t); bot = lerpColor(0xff5722, 0x87ceeb, t);
    } else if (hour >= 8 && hour < 18) {
      top = 0x1565c0; bot = 0x90caf9;
    } else if (hour >= 18 && hour < 21) {
      const t=(hour-18)/3;
      top = lerpColor(0x1565c0, 0x0d0d2b, t); bot = lerpColor(0x90caf9, 0xff5722, t);
    } else {
      top = 0x050512; bot = 0x0d1030;
    }
    g.fillGradientStyle(top, top, bot, bot, 1); g.fillRect(0, 0, 1000, 340);
  }
  drawCelestial(hour) {
    const g = this.celestialGfx; g.clear();
    const r = ((hour-6+24)%24)/14;
    const cx = 80 + (1000-160)*Math.min(1,Math.max(0,r));
    const cy = 60 + 240*Math.abs(Math.min(1,Math.max(0,r))-0.5)*2;
    if (hour>=6 && hour<20) {
      g.fillStyle(0xffee58, 1); g.fillCircle(cx, cy, 28);
      g.fillStyle(0xfff176, 0.4); g.fillCircle(cx, cy, 42);
    } else {
      g.fillStyle(0xeceff1, 1); g.fillCircle(200, 70, 22);
      g.fillStyle(0x050512, 1); g.fillCircle(210, 64, 18);
      g.fillStyle(0xffffff, 1);
      [[100,30],[250,15],[450,50],[700,25],[850,60],[150,90],[600,12]].forEach(([sx,sy])=>g.fillCircle(sx,sy,Math.random()<0.3?3:2));
    }
  }
  drawChar(age, married, children) {
    const g = this.charGfx; g.clear();
    // Scale by age: baby(0-2)=0.25, child(3-11)=0.55, teen(12-17)=0.8, adult=1.0
    const scale = age < 3 ? 0.25 : age < 6 ? 0.42 : age < 12 ? 0.60 : age < 18 ? 0.80 : 1.0;
    const x = this.charX;
    const baseY = 370; // feet always on ground
    const h_total = 80 * scale; // total character height
    const y = baseY - h_total; // head center offset

    const headR  = 18 * scale;
    const bodyW  = 32 * scale, bodyH = (age>60?42:38) * scale;
    const legH   = 28 * scale, legW  = 12 * scale;
    const shoeH  = 8  * scale;
    const eyeR   = Math.max(1, 3 * scale);

    // Shadow
    g.fillStyle(0x000000, 0.18); g.fillEllipse(x, baseY+4, 44*scale, 10*scale);
    // Body
    const bodyColor = age < 12 ? 0xe91e63 : age < 18 ? 0x43a047 : age < 30 ? 0x1565c0 : age < 50 ? 0x37474f : 0x6d6d6d;
    g.fillStyle(bodyColor, 1);
    g.fillRoundedRect(x-bodyW/2, y+headR*0.6, bodyW, bodyH, 4*scale);
    // Head
    const skinColor = age < 50 ? 0xffcc80 : 0xd4956a;
    g.fillStyle(skinColor, 1); g.fillCircle(x, y, headR);
    // Hair
    const hairColor = age < 40 ? 0x4e342e : age < 55 ? 0x8d6e63 : 0xbdbdbd;
    g.fillStyle(hairColor, 1); g.fillEllipse(x, y-headR*0.75, headR*2, headR*0.9);
    // Baby — rounder face, chubby cheeks
    if (age < 3) { g.fillStyle(0xffcc80, 0.5); g.fillCircle(x-headR*0.7, y+headR*0.1, headR*0.4); g.fillCircle(x+headR*0.7, y+headR*0.1, headR*0.4); }
    // Eyes
    g.fillStyle(0x222, 1); g.fillCircle(x-headR*0.35, y-headR*0.1, eyeR); g.fillCircle(x+headR*0.35, y-headR*0.1, eyeR);
    // Mouth
    g.lineStyle(Math.max(1,2*scale), 0x5d4037, 1);
    g.beginPath(); g.arc(x, y+headR*0.2, headR*0.35, 0.1, Math.PI-0.1, false); g.strokePath();
    // Wrinkles
    if (age > 55) {
      g.lineStyle(1, 0xa1887f, 0.5);
      g.beginPath(); g.moveTo(x-headR*0.8, y-headR*0.15); g.lineTo(x-headR*0.45, y+headR*0.1); g.strokePath();
      g.beginPath(); g.moveTo(x+headR*0.8, y-headR*0.15); g.lineTo(x+headR*0.45, y+headR*0.1); g.strokePath();
    }
    // Legs
    const legTop = y + headR*0.6 + bodyH;
    g.fillStyle(0x37474f, 1);
    g.fillRect(x-bodyW/2+legW*0.1, legTop, legW, legH);
    g.fillRect(x+bodyW/2-legW*1.1, legTop, legW, legH);
    // Shoes
    g.fillStyle(0x212121, 1);
    g.fillRect(x-bodyW/2+legW*0.1-legW*0.1, legTop+legH, legW*1.2, shoeH);
    g.fillRect(x+bodyW/2-legW*1.2, legTop+legH, legW*1.2, shoeH);
    // Cane
    if (age > 70) { g.lineStyle(3, 0xa1887f, 1); g.beginPath(); g.moveTo(x+bodyW/2+4, y+headR); g.lineTo(x+bodyW/2+14, baseY+shoeH); g.strokePath(); }
  }
  update(_, delta) {
    if (!S.isDead && Math.abs(this.charX-this.charTargetX)>0.5) {
      this.charX += (this.charTargetX - this.charX) * 0.07;
      this.drawChar(S.age, S.married, S.children);
    }
    const simHour = (S.month/12)*24 % 24;
    this.drawSky(simHour);
    this.drawCelestial(simHour);
  }
}

function lerpColor(c1, c2, t) {
  const r1=(c1>>16)&0xff, g1=(c1>>8)&0xff, b1=c1&0xff;
  const r2=(c2>>16)&0xff, g2=(c2>>8)&0xff, b2=c2&0xff;
  return (Math.round(r1+(r2-r1)*t)<<16)|(Math.round(g1+(g2-g1)*t)<<8)|Math.round(b1+(b2-b1)*t);
}

// SIMULATION ENGINE
// ============================================================
let paused = true;
let speed = 1; // months per second
const SPEEDS = [0.5, 1, 3, 12];
const SPEED_LABELS = ['ゆっくり (2秒/月)', '普通 (1秒/月)', '早い (3ヶ月/秒)', '超速 (1年/秒)'];
let speedIdx = 1;
let simTimer = 0;
let gameStarted = false;

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ 再開' : '⏸ 一時停止';
  document.getElementById('btn-pause').classList.toggle('active', paused);
}
function cycleSpeed() {
  speedIdx = (speedIdx+1) % SPEEDS.length;
  speed = SPEEDS[speedIdx];
  document.getElementById('speed-label').textContent = '速度: ' + SPEED_LABELS[speedIdx];
}

function startGame() {
  S.name = document.getElementById('name-input').value || '田中 太郎';
  document.getElementById('start-screen').style.display = 'none';
  gameStarted = true;
  paused = false;
  document.getElementById('btn-pause').textContent = '⏸ 一時停止';
  initStocks();
  log(`👶 ${S.name}が生まれました！${S.year}年${S.month}月。`, 'good');
  S.lifeEvents.push('誕生');
  updateUI();
  renderActions();
  setInterval(simLoop, 100);
}

let lastTick = Date.now();
function simLoop() {
  if (!gameStarted || paused || S.isDead) return;
  const now = Date.now();
  const delta = (now - lastTick) / 1000;
  lastTick = now;
  simTimer += delta;
  const monthDuration = 1 / speed;
  if (simTimer >= monthDuration) {
    simTimer -= monthDuration;
    tickMonth();
  }
}
// Reset lastTick when resuming to avoid burst
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastTick = Date.now(); });

// ============================================================
// MONTHLY TICK
// ============================================================
function tickMonth() {
  S.month++;
  if (S.month > 12) { S.month = 1; S.year++; S.age++; onNewYear(); }

  // Childhood phase (age 0-17)
  if (S.inChildhood) { tickChildhood(); updateUI(); renderActions(); return; }

  if (S.inUniversity) tickUniversity();
  tickFinances();

  // Passive stat changes
  tickStats();

  // Aging effects
  tickAging();

  // Children aging
  S.children.forEach(c => { c.ageMonths = (c.ageMonths||0)+1; if(c.ageMonths%12===0) c.age++; });

  // Parents
  tickParents();

  // Investment
  if (S.hasInvestment) {
    const growth = (1 + (Math.random()*0.2 - 0.08)) ** (1/12);
    S.investBalance = Math.round(S.investBalance * growth);
  }

  // Loan
  if (S.hasLoan) {
    S.loanBalance = Math.max(0, S.loanBalance - S.loanMonthly * 0.6);
    if (S.loanBalance <= 0) { S.hasLoan=false; S.loanBalance=0; S.loanMonthly=0; log('🎉 奨学金を完済しました！', 'good'); }
  }

  // Stocks
  tickStocks();
  // Random life events (not too frequent)
  if (S.month % 3 === 0) maybeRandomEvent();

  // Life stage events
  checkLifeStageEvents();

  updateUI();
  renderActions();
}

function tickChildhood() {
  // Passive childhood happiness
  S.happiness = Math.min(100, S.happiness + 0.1);
  // Random small childhood events
  if (S.month === 1 && Math.random() < 0.15) {
    const events = [
      [()=>{ S.happiness=Math.min(100,S.happiness+10); log('🎁 お年玉をもらいました！嬉しい！', 'good'); }],
      [()=>{ S.hp=Math.max(0,S.hp-8); S.stress=Math.min(100,S.stress+5); log('🤒 風邪をひきました。しばらく寝込みます。', 'bad'); }],
      [()=>{ S.social=Math.min(100,S.social+8); log('👫 友達と楽しく遊びました。', 'good'); }],
    ];
    events[Math.floor(Math.random()*events.length)][0]();
  }
  if (S.hp < 80) S.hp = Math.min(100, S.hp + 1); // 子供は回復が早い
}

  mortgageMonthly: 0,
  // 食生活
  diet: 'mixed',         // DIETS key
  // 趣味
  hobbies: [],           // HOBBIES_DATA keys
  // 保険
  insurance: 'none',     // INSURANCES key
  // 車
  ownsCar: false,
  carType: null,         // 'kei' | 'sedan' | 'suv'
  carMonthly: 0,
  // 株式ポートフォリオ
  portfolio: {},         // { '銘柄名': shares }
  // 勤務先
  currentCompany: null,  // COMPANY_JOBS entry
});

// ============================================================
// STOCK ENGINE
// ============================================================
function initStocks() {
  for (const [name, d] of Object.entries(STOCK_DATA)) {
    stockPrices[name] = d.basePrice;
  }
}

function tickStocks() {
  // Sector-wide shocks
  const sectorShock = {};
  for (const sec of ['tech','finance','auto','food','game','pharma','realestate','energy','telecom','retail']) {
    sectorShock[sec] = (Math.random() - 0.5) * 0.04;
  }
  for (const [name, d] of Object.entries(STOCK_DATA)) {
    const shock = sectorShock[d.sector] + (Math.random()-0.5)*d.vol*2;
    stockPrices[name] = Math.max(10, Math.round(stockPrices[name] * (1 + shock)));
  }
  // Dividends quarterly
  if (S.month % 3 === 0) {
    let divTotal = 0;
    for (const [name, shares] of Object.entries(S.portfolio)) {
      if (shares > 0) {
        const div = Math.round(stockPrices[name] * STOCK_DATA[name].div / 4 * shares);
        divTotal += div;
      }
    }
    if (divTotal > 0) {
      S.savings += divTotal;
      log(`💴 配当金 ¥${divTotal.toLocaleString()} を受け取りました。`, 'good');
    }
  }
  // Big events
  if (Math.random() < 0.002) {
    const names = Object.keys(STOCK_DATA);
    const target = names[Math.floor(Math.random()*names.length)];
    const up = Math.random() < 0.5;
    const change = up ? 1.3 : 0.5;
    stockPrices[target] = Math.round(stockPrices[target] * change);
    log(`📰 ${target}が${up?'急騰📈':'急落📉'}しました！（${up?'+30%':'-50%'}）`, up?'good':'bad');
  }
}

function portfolioValue() {
  let total = 0;
  for (const [name, shares] of Object.entries(S.portfolio)) {
    total += stockPrices[name] * shares;
  }
  return total;
}

function tickUniversity() {
  if (S.month === 4) {
    S.uniYear++;
    if (S.uniYear > 4) {
      S.inUniversity = false;
      S.education = 'university';
      S.lifeEvents.push('大学卒業');
      showModal('🎓', '大学卒業！', `${S.name}は大学を卒業しました。\n就職先を選んでください。`,
        buildJobOffers('university').concat([
          { label:'📚 大学院進学（さらに2年）', desc:'研究職・専門職への道', fn:()=>{ S.inUniversity=true; S.uniYear=4; S.education='university'; log('📚 大学院に進学しました。', 'normal'); } },
        ])
      );
    }
    if (S.uniYear === 2 && !S.hasLoan && S.savings < 200000) {
      showModal('📋','奨学金','学費のため、奨学金を借りますか？',[
        { label:'借りる（月3万返済・200万）', fn:()=>{ S.hasLoan=true; S.loanBalance=2000000; S.loanMonthly=30000; S.savings+=500000; log('📋 奨学金200万を借りました。', 'warn'); } },
        { label:'借りない', fn:()=>{ log('自力で乗り切ります。', 'normal'); } },
      ]);
    }
  }
  S.savings -= Math.round(50000 + (S.uniYear===1?200000:0));
}

function buildJobOffers(eduReq) {
  const pool = COMPANY_JOBS[eduReq] || [];
  // Pick 3-4 random offers
  const shuffled = pool.slice().sort(()=>Math.random()-0.5).slice(0,4);
  return shuffled.map(c => ({
    label: `${c.icon} ${c.company}（${c.role}）`,
    desc:  `月収¥${(c.gross/10000).toFixed(0)}万 | 残業${c.overtime}h | 安定度${c.stability}% | ストレス${c.stress}`,
    fn: () => {
      S.job = c.role.includes('エンジニア')||c.role.includes('AI') ? 'engineer' :
               c.role.includes('公務員')||c.role.includes('行政') ? 'office_uni' : 'office_hs';
      S.grossIncome = c.gross;
      S.currentCompany = c;
      S.jobMonths = 0;
      S.livingWith = 'alone';
      S.stress = Math.min(100, S.stress + c.stress * 0.3);
      log(`${c.icon} ${c.company}の${c.role}として入社しました！月収¥${(c.gross/10000).toFixed(0)}万。`, 'good');
      S.lifeEvents.push(`${c.company}入社`);
      // Move out → choose apartment
      showApartmentChoice();
    },
  }));
}

// ============================================================
// FINANCES
// ============================================================
function calcExpenses() {
  let rent=0, food=0, util=0, ins=0, edu=0, misc=0;
  // 住居
  if (S.ownHouse) {
    rent = S.mortgageMonthly;
  } else if (S.apartment) {
    rent = S.apartment.rent;
    util = S.married ? 18000 : 10000;
  } else if (S.livingWith === 'parents') {
    food = 20000; util = 5000; misc = 15000;
  } else {
    rent = 68000; util = 10000;
  }
  // 食生活
  const dietData = DIETS.find(d=>d.key===S.diet) || DIETS[1];
  food = S.livingWith==='parents' ? food : dietData.cost * (S.married?1.8:1) + S.children.filter(c=>c.age<18).length*10000;
  // 光熱費補正
  if (S.livingWith!=='parents') util += S.married ? 5000 : 0;
  // 保険
  const insData = INSURANCES.find(i=>i.key===S.insurance);
  ins = insData ? insData.cost : 0;
  // 社会保険（会社員なら天引き済みとみなさない → 自営・無職は別途）
  if (!S.job || S.job==='unemployed' || S.job==='freelance') ins += 16000;
  // 子の教育費
  S.children.forEach(c => {
    if (c.age>=3&&c.age<6) edu+=25000;
    else if (c.age>=6&&c.age<15) edu+=15000;
    else if (c.age>=15&&c.age<18) edu+=30000;
    else if (c.age>=18&&c.age<22) edu+=60000;
  });
  // 趣味費
  let hobbyTotal = 0;
  S.hobbies.forEach(hk=>{ const h=HOBBIES_DATA.find(d=>d.key===hk); if(h) hobbyTotal+=h.cost; });
  // 車
  if (S.ownsCar) misc += S.carMonthly;
  // ローン各種
  misc += S.loanMonthly + hobbyTotal;
  return { rent, food, util, ins, edu, misc };
}

function tickFinances() {
  if (S.inChildhood || S.inUniversity || !S.job) return;
  const tax = calcTax(S.grossIncome);
  S.netIncome = S.grossIncome - tax;
  const exp = calcExpenses();
  const totalExp = exp.rent+exp.food+exp.util+exp.ins+exp.edu+exp.misc;
  const net = S.netIncome - totalExp;
  S.savings += net;
  if (S.savings < 0) log(`⚠️ 貯蓄がマイナス（¥${Math.abs(S.savings).toLocaleString()}の借金）`, 'bad');
  if (S.savings < -1000000) { log('💸 多重債務。生活が破綻しています。', 'bad'); S.stress=Math.min(100,S.stress+20); S.happiness=Math.max(0,S.happiness-20); }
  S.jobMonths++;
  checkPromotion();
  if (S.job==='unemployed') {
    S.unemployedMonths++;
    if (S.unemployedMonths>=3) log('⚠️ 無職期間が長くなっています。', 'warn');
    if (S.unemployedMonths<=6) S.savings+=80000;
  } else { S.unemployedMonths=0; }
  // 住宅ローン残高減少
  if (S.ownHouse && S.mortgage > 0) {
    S.mortgage = Math.max(0, S.mortgage - S.mortgageMonthly * 0.7);
    if (S.mortgage <= 0) { log('🏠 住宅ローンを完済しました！', 'good'); S.mortgage=0; S.mortgageMonthly=0; }
  }
  // 食生活の健康影響
  const dietData = DIETS.find(d=>d.key===S.diet) || DIETS[1];
  S.hp = Math.max(0, Math.min(100, S.hp + dietData.hpMod));
  S.happiness = Math.max(0, Math.min(100, S.happiness + dietData.happyMod));
  // 趣味の効果
  S.hobbies.forEach(hk=>{
    const h = HOBBIES_DATA.find(d=>d.key===hk);
    if (!h) return;
    S.hp = Math.max(0,Math.min(100,S.hp+h.hpMod));
    S.stress = Math.max(0,Math.min(100,S.stress+h.stressMod));
    S.happiness = Math.max(0,Math.min(100,S.happiness+h.happyMod));
    S.social = Math.max(0,Math.min(100,S.social+h.socialMod));
  });
  // 残業ストレス（会社の残業時間）
  if (S.currentCompany) {
    const otStress = S.currentCompany.overtime / 100;
    S.stress = Math.min(100, S.stress + otStress);
  }
}

function tickStats() {
  S.stress = Math.max(0, S.stress - 1 + (S.job==='unemployed'?3:0));
  if (S.stress > 70) S.hp = Math.max(0, S.hp - 0.5);
  if (S.savings < 100000) S.happiness = Math.max(0, S.happiness - 1);
  S.social = Math.max(0, S.social - 0.5);
  if (S.married) S.happiness = Math.min(100, S.happiness + 0.3);
  if (S.exerciseStreak > 0) { S.hp = Math.min(100, S.hp+0.3); S.exerciseStreak--; }
  // 住居の快適さ
  if (S.apartment) S.happiness = Math.min(100, S.happiness + S.apartment.comfort*0.002);
  else if (S.ownHouse) S.happiness = Math.min(100, S.happiness + 0.15);
}

function tickAging() {
  if (S.age < 30) return;
  const d = S.age<40?0.1:S.age<50?0.2:S.age<60?0.35:S.age<70?0.5:0.8;
  S.hp = Math.max(0, S.hp - d);
  if (S.hp <= 0) { triggerDeath('老衰・病気'); return; }
  if (S.age >= 40 && Math.random() < 0.008) triggerHealthCrisis();
}

function tickParents() {
  if (S.age < 45) return;
  S.parentHealth = Math.max(0, S.parentHealth-(1+Math.random()));
  if (S.parentHealth < 40 && !S.parentNeedsCare && Math.random() < 0.05) {
    S.parentNeedsCare = true;
    showModal('👴','親の介護',`${S.name}の親が介護が必要になりました。`,[
      { label:'施設に入れる（月15万）', fn:()=>{ S.loanMonthly+=150000; log('👴 介護施設に入れました。月15万の負担。', 'warn'); S.lifeEvents.push('親の介護（施設）'); } },
      { label:'自宅介護（月5万＋時間）', fn:()=>{ S.loanMonthly+=50000; S.stress=Math.min(100,S.stress+20); log('👴 自宅介護開始。ストレス増加。', 'warn'); S.lifeEvents.push('親の介護（自宅）'); } },
      { label:'兄弟に任せる', fn:()=>{ S.happiness=Math.max(0,S.happiness-10); log('😔 介護を兄弟に任せました。', 'normal'); } },
    ]);
  }
  if (S.parentHealth <= 0 && S.parentNeedsCare) {
    S.parentHealth = 0; S.parentNeedsCare = false;
    log('😢 親が亡くなりました。', 'bad');
    S.happiness = Math.max(0, S.happiness-25); S.lifeEvents.push('親の死');
    const inherit = Math.floor(Math.random()*3000000)+500000;
    S.savings += inherit;
    log(`💰 遺産¥${inherit.toLocaleString()}を受け取りました。`, 'good');
  }
}

function checkPromotion() {
  if (!S.job||S.job==='parttime'||S.job==='unemployed') return;
  const base = ['office_hs','office_uni','engineer','sales'];
  if (base.includes(S.job) && S.jobMonths>=60) {
    S.job='manager'; S.grossIncome=JOBS.manager.gross;
    log('🎉 課長に昇進しました！月収50万！', 'good'); S.lifeEvents.push('課長昇進');
  } else if (S.job==='manager' && S.jobMonths>=120) {
    S.job='senior_mgr'; S.grossIncome=JOBS.senior_mgr.gross;
    log('🎉 部長に昇進しました！月収65万！', 'good'); S.lifeEvents.push('部長昇進');
  } else if (S.job==='senior_mgr' && S.jobMonths>=180) {
    S.job='executive'; S.grossIncome=JOBS.executive.gross;
    log('👑 役員就任！月収90万！', 'good'); S.lifeEvents.push('役員就任');
  }
  if (S.jobMonths%12===0 && S.grossIncome>0) {
    const raise = Math.round(S.grossIncome*0.02);
    S.grossIncome += raise;
    if (raise>3000) log(`📈 昇給（+¥${raise.toLocaleString()}/月）`, 'good');
  }
}

function onNewYear() {
  if (S.inChildhood) { onChildhoodYear(); updateUI(); renderActions(); return; }
  log(`━━ ${S.year}年 ${S.name}は${S.age}歳 ━━`, 'month');
  S.lifeEvents.push(`${S.age}歳`);
  if (S.age===25 && !S.married) log('💭 周りが結婚し始めました。', 'normal');
  if (S.age===30 && !S.married) log('💭 30代。社会的プレッシャーを感じます。', 'warn');
  if (S.age===30 && !S.ownHouse) log('💭 マイホームを考え始める年齢です。', 'normal');
  if (S.age===40) log('💭 40代。人生の折り返しです。', 'normal');
  if (S.age===50) { log('💭 50代。老後を真剣に考えましょう。', 'warn'); }
  if (S.age===60) log('💭 定年まであと5年。老後の準備は？', 'warn');
  if (S.age===65) {
    const totalAssets = S.savings + portfolioValue() + (S.ownHouse ? 20000000 : 0);
    if (totalAssets < 20000000) log('⚠️ 老後2000万問題。資産が足りません！', 'bad');
    else log(`✅ 老後資産¥${(totalAssets/10000).toFixed(0)}万。十分です！`, 'good');
    if (S.job && !['unemployed','parttime','retired'].includes(S.job)) {
      showModal('📋','定年退職',`65歳。定年を迎えました。`,[
        { label:'引退する（年金月12万）', fn:()=>{ S.job='retired'; S.grossIncome=120000; S.lifeEvents.push('定年退職'); log('🎌 退職しました。年金生活。', 'good'); } },
        { label:'再雇用で続ける（月収半額）', fn:()=>{ S.grossIncome=Math.round(S.grossIncome*0.5); log('👔 再雇用で働き続けます。', 'normal'); } },
      ]);
    }
  }
  if (S.age>=85 && Math.random()<0.15+(100-S.hp)/200) triggerDeath('老衰');
}

function checkLifeStageEvents() {
  if (S.inChildhood) return;
  const mid = S.year*12+S.month;
  if (mid - S.lastEventMonth < 5) return;

  // 出会い
  if (!S.married && !S.partner && S.age>=22 && S.age<=45 && Math.random()<0.015) {
    S.lastEventMonth = mid;
    const names = ['山田 花子','佐藤 美咲','田中 愛','鈴木 奈々','高橋 さくら','渡辺 陽子','伊藤 恵','中村 詩'];
    const n = names[Math.floor(Math.random()*names.length)];
    const pa = S.age + Math.floor(Math.random()*6)-3;
    const meet = ['職場で','合コンで','マッチングアプリで','趣味のサークルで','友人の紹介で'];
    const where = meet[Math.floor(Math.random()*meet.length)];
    showModal('💘','出会い',`${where}${pa}歳の${n}と出会いました。`,[
      { label:'交際を始める', fn:()=>{ S.partner={name:n,age:pa,metYear:S.year}; log(`💑 ${n}さんと交際開始。`, 'good'); S.happiness=Math.min(100,S.happiness+15); } },
      { label:'断る', fn:()=>{ log('今は仕事に集中します。', 'normal'); } },
    ]);
  }
  // プロポーズ
  if (S.partner && !S.married && S.age>=24) {
    const dy = S.year - S.partner.metYear;
    if (dy>=2 && Math.random()<0.04) {
      S.lastEventMonth = mid;
      showModal('💍','プロポーズ',`${S.partner.name}との交際${dy}年。結婚しますか？`,[
        { label:'結婚する（式費用300万・折半）', fn:()=>{
          S.married=true; S.livingWith='family'; S.savings-=1500000;
          S.lifeEvents.push(`${S.partner.name}と結婚`);
          log(`💍 ${S.partner.name}と結婚しました！`, 'good');
          S.happiness=Math.min(100,S.happiness+20);
          if (S.apartment) { // 2LDK以上に引越し提案
            showModal('🏠','新居選び','結婚のため新居を探しましょう。',
              APARTMENTS.filter(a=>a.rent>=80000).map(a=>({
                label:`${a.name}（¥${(a.rent/10000).toFixed(0)}万/月）`,
                desc: a.desc,
                fn:()=>{ S.apartment=a; log(`🏠 ${a.name}に引越しました。`, 'good'); },
              })).concat([{ label:'今のまま', fn:()=>{ log('今の住居のままにします。', 'normal'); } }])
            );
          }
        }},
        { label:'もう少し待つ', fn:()=>{ log('もう少し待つことにしました。', 'normal'); } },
        { label:'別れる', fn:()=>{ S.partner=null; log('😔 別れました。', 'bad'); S.happiness=Math.max(0,S.happiness-20); } },
      ]);
    }
  }
  // 子供
  if (S.married && S.age>=25 && S.age<=42 && S.children.length<3 && Math.random()<0.02) {
    S.lastEventMonth = mid;
    showModal('👶','子供について','子供を持ちますか？',[
      { label:'子供を作る（出産費用50万）', fn:()=>{
        const ns=['太郎','花子','次郎','陽菜','翔','さくら'];
        const n=ns[Math.floor(Math.random()*ns.length)];
        S.children.push({name:n,age:0,ageMonths:0});
        S.savings-=500000;
        S.lifeEvents.push(`${n}誕生`);
        log(`👶 ${n}が生まれました！`, 'good'); S.happiness=Math.min(100,S.happiness+20);
      }},
      { label:'まだ早い', fn:()=>{ log('子供はまだ先にします。', 'normal'); } },
      { label:'子供は持たない（DINKS）', fn:()=>{ log('DINKSを選択しました。', 'normal'); S.lifeEvents.push('DINKS選択'); } },
    ]);
  }
  // 景気後退
  if (Math.random()<0.003) {
    S.lastEventMonth=mid;
    log('📉 景気後退。株価・給与に影響が出ています。', 'bad');
    S.grossIncome=Math.round(S.grossIncome*0.85);
    for (const name of Object.keys(S.portfolio)) stockPrices[name]=Math.round(stockPrices[name]*0.7);
    S.lifeEvents.push('経済危機');
  }
}

function maybeRandomEvent() {
  if (S.isDead || S.inChildhood) return;
  const r = Math.random();
  const evs = [
    { w:0.03, fn:()=>{ const b=Math.floor(Math.random()*250000)+50000; S.savings+=b; log(`💰 臨時ボーナス¥${b.toLocaleString()}！`, 'good'); } },
    { w:0.02, fn:()=>{ S.happiness=Math.min(100,S.happiness+15); log('🌸 素晴らしい体験をしました。', 'good'); } },
    { w:0.02, fn:()=>{ if(S.savings>500000){ S.savings-=200000; S.hp=Math.min(100,S.hp+10); log('🏥 人間ドックを受けました（¥20万）。', 'warn'); } } },
    { w:0.025, fn:()=>{ if(S.ownsCar){ const c=Math.floor(Math.random()*200000)+50000; S.savings-=c; log(`🚗 車の修理費¥${c.toLocaleString()}が発生。`, 'bad'); } } },
    { w:0.02, fn:()=>{ const c=Math.floor(Math.random()*100000)+30000; S.savings-=c; S.hp=Math.max(0,S.hp-8); log(`🏥 突然の入院費¥${c.toLocaleString()}。`, 'bad'); S.stress=Math.min(100,S.stress+15);
      // 保険給付
      const ins=INSURANCES.find(i=>i.key===S.insurance);
      if(ins&&ins.coverage>0){ const pay=Math.min(c,ins.coverage*0.3|0); S.savings+=pay; log(`🛡️ 保険から¥${pay.toLocaleString()}給付されました。`,'good'); }
    } },
    { w:0.015, fn:()=>{ S.stress=Math.min(100,S.stress+20); S.hp=Math.max(0,S.hp-5); log('😰 職場でのトラブル。', 'bad'); } },
    { w:0.01, fn:()=>{ if(S.job&&!['unemployed','parttime'].includes(S.job)){ log('🚨 リストラ対象に！再就職が必要です。', 'bad'); S.job='unemployed'; S.grossIncome=0; S.lifeEvents.push('リストラ'); S.stress=Math.min(100,S.stress+30); } } },
    { w:0.008, fn:()=>{ if(S.married){ showModal('💔','夫婦の危機','夫婦関係に問題が生じています。',[
      { label:'カウンセリング（¥10万）', fn:()=>{ S.savings-=100000; S.happiness=Math.min(100,S.happiness+15); log('💑 カウンセリングで改善。', 'good'); } },
      { label:'離婚する', fn:()=>{ S.married=false; S.partner=null; S.savings=Math.round(S.savings*0.5); S.lifeEvents.push('離婚'); log('💔 離婚。財産を折半。', 'bad'); S.happiness=Math.max(0,S.happiness-30); } },
    ]); } } },
  ];
  let cum=0; for (const e of evs) { cum+=e.w; if(r<cum){e.fn();break;} }
}

function triggerHealthCrisis() {
  const cs=[
    { name:'がん（早期発見）',cost:1000000,hpLoss:20,fn:()=>log('🏥 がん早期発見。治療費100万。','bad') },
    { name:'脳梗塞',cost:2000000,hpLoss:35,fn:()=>{ log('🚑 脳梗塞で入院。','bad'); S.stress=Math.min(100,S.stress+30); } },
    { name:'心筋梗塞',cost:1500000,hpLoss:30,fn:()=>log('🚑 心筋梗塞で入院。','bad') },
    { name:'糖尿病',cost:200000,hpLoss:10,fn:()=>log('🏥 糖尿病診断。生活改善を。','warn') },
    { name:'うつ病',cost:300000,hpLoss:15,fn:()=>{ log('😔 うつ病と診断されました。','bad'); S.stress=Math.min(100,S.stress+40); S.happiness=Math.max(0,S.happiness-25); } },
  ];
  const c=cs[Math.floor(Math.random()*cs.length)];
  S.savings-=c.cost; S.hp=Math.max(0,S.hp-c.hpLoss);
  S.lifeEvents.push(c.name); c.fn();
  // 保険給付
  const ins=INSURANCES.find(i=>i.key===S.insurance);
  if(ins&&ins.coverage>0){ const pay=Math.min(c.cost,ins.coverage*0.5|0); S.savings+=pay; log(`🛡️ 保険から¥${pay.toLocaleString()}給付。`,'good'); }
  if(S.hp<=0) triggerDeath(c.name);
}

function triggerDeath(cause) {
  S.isDead=true; S.deathAge=S.age; S.deathCause=cause; paused=true;
  S.lifeEvents.push(`${S.age}歳で死亡（${cause}）`);
  setTimeout(showGameOver,1500);
}

function showGameOver() {
  document.getElementById('gameover').classList.add('active');
  const childrenStr = S.children.length>0 ? S.children.map(c=>c.name).join('・') : 'なし';
  const pv = portfolioValue();
  const totalAssets = Math.max(0,S.savings)+pv+(S.ownHouse?15000000:0);
  const summary=[
    `死因: ${S.deathCause}`,
    `享年: ${S.deathAge}歳`,
    `最終職業: ${S.currentCompany?S.currentCompany.company+' '+S.currentCompany.role : (JOBS[S.job]?.title||'無職')}`,
    `総資産: ¥${totalAssets.toLocaleString()}（貯蓄¥${Math.max(0,S.savings).toLocaleString()} + 株¥${pv.toLocaleString()}）`,
    `住居: ${S.ownHouse?'マイホーム':S.apartment?S.apartment.name:'賃貸'}`,
    `結婚: ${S.married?(S.partner?.name+'と'):'独身'}　子供: ${childrenStr}`,
    `保険: ${INSURANCES.find(i=>i.key===S.insurance)?.name||'なし'}`,
    `主な出来事: ${S.lifeEvents.filter(e=>!e.match(/^\d+歳$/)).slice(-6).join(' → ')}`,
  ].join('\n');
  document.getElementById('go-summary').textContent=summary;
}

  acts.push({label:'🎯 趣味を管理する',fn:()=>showHobbyMenu()});

  else acts.push({label:`📊 株式ポートフォリオ`,fn:()=>showStockMarket()});
  // 住居
  if (!S.ownHouse && S.savings>=10000000) acts.push({label:'🏠 マイホームを購入',fn:()=>showHousePurchase()});
  if (!S.apartment && S.livingWith!=='parents') acts.push({label:'🏠 引越しする',fn:()=>showApartmentChoice()});

  return acts;
}

function showStockMarket() {

  for (const [name, d] of Object.entries(STOCK_DATA)) {
    const price=stockPrices[name]||d.basePrice;

    const val=price*held;
    const change=Math.round((price/d.basePrice-1)*100);
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #21262d;font-size:12px;';

      <span style="width:50px;text-align:right;color:#8b949e;font-size:10px">${held}株</span>
      <button onclick="buyStock('${name}',1)" style="background:#1f6feb;border:none;border-radius:4px;padding:3px 7px;color:#fff;cursor:pointer;font-size:11px">買</button>

    `;

function buyStock(name, qty) {
  const price=stockPrices[name];
  const cost=price*qty;
  if (S.savings<cost){ log(`⚠️ 残高不足（¥${cost.toLocaleString()}必要）`,'warn'); return; }
  S.savings-=cost;
  S.portfolio[name]=(S.portfolio[name]||0)+qty;
  log(`📈 ${name}を${qty}株購入（¥${cost.toLocaleString()}）。`,'good');
  updateUI();
  // refresh modal body
  document.getElementById('modal-body').textContent=`保有株式評価額: ¥${portfolioValue().toLocaleString()} | 貯蓄: ¥${S.savings.toLocaleString()}`;
  showStockMarket();
}

function sellStock(name) {
  const shares=S.portfolio[name]||0;
  if (shares<=0) return;
  const proceeds=stockPrices[name]*shares;
  S.savings+=proceeds;
  const baseCost=STOCK_DATA[name].basePrice*shares;
  const pl=proceeds-baseCost;
  S.portfolio[name]=0;
  log(`📉 ${name}を全${shares}株売却（¥${proceeds.toLocaleString()}、損益${pl>=0?'+':''}¥${pl.toLocaleString()}）。`,pl>=0?'good':'bad');
  updateUI();
  showStockMarket();
}

function showModal(icon, title, body, choices) {
  paused = true;
  document.getElementById('modal-icon').textContent = icon;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  const choicesEl = document.getElementById('modal-choices');
  choicesEl.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.label + (c.desc ? `<div class="choice-desc">${c.desc}</div>` : '');
    btn.onclick = () => {
      closeModal();
      c.fn();
      updateUI();
      renderActions();
    };
    choicesEl.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  paused = false;
  lastTick = Date.now();
}

// UI UPDATE
// ============================================================
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function updateUI() {
  // Bars
  const setBar = (id, val) => {
    document.getElementById('bar-'+id).style.width = clamp(val,0,100)+'%';
    document.getElementById('val-'+id).textContent = Math.round(val);
  };
  setBar('hp', S.hp);
  setBar('st', S.stress);
  setBar('hap', S.happiness);
  setBar('soc', S.social);

  // Char info
  const info = document.getElementById('char-info');
  let lines = [`<span>${S.name}</span>　${S.age}歳`, `${S.year}年${S.month}月`];
  if (S.inChildhood) {
    const stage = S.age < 3 ? '👶 赤ちゃん' : S.age < 6 ? '🧒 幼稚園児' : S.age < 12 ? '🏫 小学生' : S.age < 15 ? '🏫 中学生' : '🏫 高校生';
    lines.push(`<span>${stage}</span>`);
    lines.push(`📚 勉強力: ${Math.round(S.studyLevel)}`);
    lines.push(`⚽ 運動力: ${Math.round(S.athleticLevel)}`);
  } else {
    const jobInfo = S.inUniversity ? `大学${S.uniYear}年生` : (JOBS[S.job]?.title || '無職');
    const famInfo = S.married ? `既婚（${S.partner?.name}）` : (S.partner ? `交際中（${S.partner?.name}）` : '独身');
    const childInfo = S.children.length > 0 ? `子供: ${S.children.map(c=>`${c.name}(${c.age}歳)`).join(' ')}` : '';
    lines.push(`学歴: ${S.education==='university'?'大卒':'高卒'}`);
    lines.push(`職業: <span>${jobInfo}</span>`);
    lines.push(famInfo);
    if (childInfo) lines.push(childInfo);
    if (S.hasLoan) lines.push(`奨学金残: ¥${S.loanBalance.toLocaleString()}`);
    if (S.parentNeedsCare) lines.push('👴 親の介護中');
  }
  info.innerHTML = lines.filter(Boolean).map(l=>`<div>${l}</div>`).join('');

  // Finance
  if (S.inChildhood) {
    document.getElementById('savings-big').textContent = S.age < 6 ? '—' : `¥${S.savings.toLocaleString()}`;
    document.getElementById('savings-big').style.color = '#8b949e';
    document.getElementById('fin-income').textContent = '親が管理中';
    ['fin-rent','fin-food','fin-util','fin-ins','fin-edu','fin-misc'].forEach(id=>{ document.getElementById(id).textContent='—'; });
    document.getElementById('fin-net').textContent = '—';
    document.getElementById('date-display').textContent = `${S.year}年${S.month}月`;
    return;
  }
  const pv = portfolioValue();
  const totalAssets = Math.max(0,S.savings) + pv + (S.ownHouse?15000000:0);
  if (S.savings < 0) {
    document.getElementById('savings-big').style.color='#f85149';
    document.getElementById('savings-big').textContent = '¥'+S.savings.toLocaleString()+'（借金）';
  } else {
    document.getElementById('savings-big').style.color='#58a6ff';
    document.getElementById('savings-big').textContent = '¥'+S.savings.toLocaleString();
  }
  document.getElementById('savings-label').textContent = `貯蓄　株¥${pv.toLocaleString()}　総¥${totalAssets.toLocaleString()}`;

  const tax = calcTax(S.grossIncome);
  S.netIncome = S.grossIncome - tax;
  const exp = calcExpenses();
  const net = S.netIncome - (exp.rent+exp.food+exp.util+exp.ins+exp.edu+exp.misc);
  const dietName = DIETS.find(d=>d.key===S.diet)?.name||'';
  const housing = S.ownHouse?'ローン返済':S.apartment?S.apartment.name.slice(0,8):'実家';
  document.getElementById('fin-income').textContent = S.inUniversity?'¥0（学生）':'¥'+S.netIncome.toLocaleString();
  document.getElementById('fin-rent').textContent = `-¥${exp.rent.toLocaleString()} ${housing}`;
  document.getElementById('fin-food').textContent = `-¥${exp.food.toLocaleString()} ${dietName}`;
  document.getElementById('fin-util').textContent = '-¥'+exp.util.toLocaleString();
  document.getElementById('fin-ins').textContent = `-¥${exp.ins.toLocaleString()} ${INSURANCES.find(i=>i.key===S.insurance)?.name.slice(0,6)||''}`;
  document.getElementById('fin-edu').textContent = '-¥'+exp.edu.toLocaleString();
  document.getElementById('fin-misc').textContent = `-¥${exp.misc.toLocaleString()} ${S.ownsCar?'🚗':''}${S.hobbies.length>0?'🎯':''}`;
  const netEl = document.getElementById('fin-net');
  netEl.textContent = (net>=0?'+':'')+'¥'+net.toLocaleString();
  netEl.className = net>=0?'money-pos':'money-neg';

  // Date
  document.getElementById('date-display').textContent = `${S.year}年${S.month}月`;

  // Draw character
  if (phaserScene) {
    phaserScene.charTargetX = 300 + Math.sin(S.month)*150;
    phaserScene.drawChar(S.age, S.married, S.children);
  }
}

// ============================================================
// LOG
// ============================================================
function log(msg, type='normal') {
  const body = document.getElementById('log-body');
  const el = document.createElement('div');
  el.className = 'log-entry log-' + type;
  el.textContent = `[${S.year}/${String(S.month).padStart(2,'0')}] ${msg}`;
  body.prepend(el);
  // Trim log
  while (body.children.length > 80) body.removeChild(body.lastChild);
}
</script>
